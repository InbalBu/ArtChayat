<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
  <meta name="google-site-verification" content="1mLEa9PZka9OeDM2PExHNbnqSIeiAB0ZnUlR1c5HpZ0" />
  <meta charset="utf-8" />
  <!-- The site's full wordmark logo (logoHe.png) is a wide rectangle with
       small text, illegible at the tiny square size browser tabs and
       Google search results actually render a favicon at. This is a
       square crop of just the signature-mark portion of that same logo
       (the "אומנות ישראלית" text bar dropped, the scribble kept) - one
       consistent icon for every page/language rather than swapped via
       JS per URL, since a favicon doesn't need to be bilingual. -->
  <link rel="icon" type="image/png" href="/favicon-32.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#000000" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700&display=swap">
  <link rel="manifest" href="/manifest.json" />
  <title>ארט חייט אומנות ישראלית | ArtChayat</title>

  <!-- name="description" / name="keywords" are intentionally NOT set here:
       every route sets its own via react-helmet-async, and Helmet cannot
       remove a tag it didn't render, so a static default here would sit
       alongside (not replace) each page's real one - two description
       tags on every URL, with this generic one first in the DOM where
       crawlers look first. og:*/twitter:* stay static below since those
       genuinely need a fallback for non-JS-executing bots. -->


  <!-- Default Open Graph / Twitter Card tags. Each page overrides these at
       runtime via react-helmet-async, but crawlers/bots that don't execute
       JavaScript (e.g. WhatsApp, Slack link previews) only ever see this
       static markup - and since the site is a single-page app with one
       index.html served for every URL (see the Netlify redirect rule),
       there's no way for a non-JS bot to tell /he/ links from /en/ links
       apart. So these are intentionally one bilingual line each (Hebrew +
       English together) rather than picked per language. -->
  <meta property="og:title" content="ארט חייט אומנות ישראלית | ArtChayat" />
  <meta property="og:description" content="יצירות מקוריות מאת האמנים שושי ויעקב חייט ז״ל | Original artworks by Jacob &amp; Shoshi Chayat" />
  <meta property="og:image" content="https://artchayat.netlify.app/shoshiandjacob.jpeg" />
  <meta property="og:url" content="https://artchayat.netlify.app/he/" />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="he_IL" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="ארט חייט אומנות ישראלית | ArtChayat" />
  <meta name="twitter:description" content="יצירות מקוריות מאת האמנים שושי ויעקב חייט ז״ל | Original artworks by Jacob &amp; Shoshi Chayat" />
  <meta name="twitter:image" content="https://artchayat.netlify.app/shoshiandjacob.jpeg" />
</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>

  <script type="application/ld+json" id="org-logo">
    {
      "@context": "http://schema.org",
      "@type": "Organization",
      "name": "Art Chayat",
      "url": "https://artchayat.netlify.app/",
      "logo": "https://artchayat.netlify.app/logoHe.png",
      "sameAs": [
        "https://www.facebook.com/JacobChayat"
      ]
    }
  </script>

  <script>
    // Keeps the Organization structured data pointed at whichever language's
    // wordmark logo matches the current URL (favicon itself is static now -
    // see the <link rel="icon"> above - a tab icon doesn't need to change
    // per language the way this SEO logo reference still should).
    function updateLogo() {
      const currentUrl = window.location.href;
      const orgLogoScript = document.getElementById("org-logo");
      let logoUrl;

      if (currentUrl.includes("/he")) {
        logoUrl = "https://artchayat.netlify.app/logoHe.png";
      } else if (currentUrl.includes("/en")) {
        logoUrl = "https://artchayat.netlify.app/logoEN.png";
      } else {
        // Default logo (Hebrew)
        logoUrl = "https://artchayat.netlify.app/logoHe.png";
      }

      // Update the logo in structured data (ld+json)
      const orgLogoJson = JSON.parse(orgLogoScript.innerHTML);
      orgLogoJson.logo = logoUrl;
      orgLogoScript.innerHTML = JSON.stringify(orgLogoJson, null, 2);
    }

    // Call the function on page load
    window.onload = updateLogo;
  </script>
</body>

</html>
